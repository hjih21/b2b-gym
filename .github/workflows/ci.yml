name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # gradlew가 backend/ 안에 있어서

    steps:
      - uses: actions/checkout@v4          # 코드 내려받기

      - uses: actions/setup-java@v4        # JDK 21 (build.gradle toolchain과 맞춤)
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4   # Gradle 캐시 → 두 번째부터 빨라짐

      - name: Test
        run: ./gradlew test

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test
